<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨機分組｜興嘉國小</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#111827;--mut:#6b7280;--fill:#f3f4f6;--bd:#d1d5db;--navy:#0b1f3a;--navy2:#143060;--btn:#0b1f3a;--btnx:#fff;--tabon:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d14;--card:#171923;--tx:#eceef5;--mut:#9aa1b2;--fill:#222532;--bd:#343849;--btn:#3b5bdb}}
:root[data-theme="dark"]{--bg:#0d0d14;--card:#171923;--tx:#eceef5;--mut:#9aa1b2;--fill:#222532;--bd:#343849;--btn:#3b5bdb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:600}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 48px}
.top{text-align:right;margin-bottom:6px}
.top button{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.fl{font-size:14px;font-weight:800;margin:0 0 10px;display:block}
textarea,input[type=number],select{width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--fill);color:var(--tx);font:inherit;font-size:16px;padding:14px;outline:none}
textarea{height:250px;resize:vertical;margin-bottom:22px}
textarea::placeholder{color:var(--mut);opacity:.8}
input[type=number],select{height:50px;padding:0 14px;margin-bottom:16px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:18px;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--btn)}
.go{width:100%;height:52px;border:0;border-radius:16px;background:var(--btn);color:var(--btnx);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.res{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:26px;padding:18px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;min-height:80px}
.res span{color:#a9bde3;font-size:13px;font-weight:800;padding-top:30px}
.res b{font-size:20px;text-align:right}
.cnt{background:var(--fill);border-radius:22px;padding:22px 20px;display:flex;justify-content:space-between;align-items:center}
.cnt span{color:var(--mut);font-size:13px;font-weight:800}
.cnt b{font-size:24px}
.acts{margin-top:14px}
.g{width:100%;height:42px;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:24px}
.gp{background:var(--fill);border-radius:22px;padding:16px}
.gp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.gp h3 small{color:var(--mut)}
.gp div{font-size:18px;padding:3px 0}
.gp em{font-style:normal;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><button id="theme">☀︎ / ☾ 切換</button></div>
 <div class="cols">
  <div class="card">
   <label class="fl">名單（一行一個名字）</label>
   <textarea id="list" placeholder="小明&#10;小華&#10;小美"></textarea>
   <label class="fl">分組方式</label>
   <select id="mode"><option value="g">分成幾組</option><option value="s">每組幾人</option></select>
   <label class="fl">數量</label>
   <input type="number" id="v" min="1" value="4">
   <label class="ck"><input type="checkbox" id="lead"> 每組第一位為組長</label>
   <button class="go" id="go">開始分組</button>
  </div>
  <div>
   <div class="res"><span>分組結果</span><b id="out">—</b></div>
   <div class="cnt"><span>名單人數</span><b id="cnt">0</b></div>
   <div class="acts"><button class="g" id="copy">複製結果</button></div>
  </div>
 </div>
 <div class="groups" id="groups"></div>
</div>
<script>
const $=s=>document.querySelector(s),K='xj-group';
let last=[];
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function names(){return $('#list').value.split('\n').map(s=>s.trim()).filter(Boolean)}
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function upd(){$('#cnt').textContent=names().length;sv(K,$('#list').value)}
$('#list').value=ld(K,'');upd();$('#list').oninput=upd;
$('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0d0d14'?'light':'dark'};
$('#go').onclick=()=>{
 const p=shuffle(names()),N=p.length,v=Math.max(1,parseInt($('#v').value)||1);
 if(!N){alert('請先輸入名單');return}
 const g=$('#mode').value==='g'?Math.min(v,N):Math.ceil(N/v);
 last=Array.from({length:g},()=>[]);
 p.forEach((x,i)=>last[i%g].push(x));
 const lead=$('#lead').checked;
 $('#out').textContent=g+' 組';
 $('#groups').innerHTML=last.map((m,i)=>'<div class="gp"><h3>第 '+(i+1)+' 組<small>'+m.length+' 人</small></h3>'+m.map((x,j)=>'<div>'+esc(x)+(lead&&j===0?' <em>★組長</em>':'')+'</div>').join('')+'</div>').join('')};
$('#copy').onclick=()=>{try{navigator.clipboard.writeText(last.map((m,i)=>'第'+(i+1)+'組：'+m.join('、')).join('\n'))}catch(e){}};
</script>
</body>
</html>
